<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kick out the jams.</title>
<link rel="stylesheet" href="https://use.typekit.net/hhk3ysu.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
  <h1>Kick out the jams.</h1>

  <div class="search-wrap">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" class="search-input" id="searchInput" placeholder="What are you in the mood for?">
    <button class="search-clear" id="searchClear" aria-label="Clear search">&times;</button>
  </div>

  <p class="jump-label">Jump to...</p>
  <div class="genre-chips" id="genreChips"></div>

  <button class="shuffle-btn" id="shuffleBtn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
    Pick one for me
  </button>

  <p class="record-count" id="recordCount"></p>
  <div class="record-list" id="recordList">
    <div class="loading-state">Loading records...</div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-sheet" id="modalSheet"></div>
</div>

<script>
// ======================================================
//  CONFIG
// ======================================================
const NTFY_TOPIC = 'chateaunewhall-vinylrequest-2026';

const SECTION_MAP = {
  '12"': '12" (Pop)', 'Electronic': 'Electronic', 'Funk/Soul': 'Funk/Soul',
  'Indie': 'Indie', 'International': 'International', 'Jazz': 'Jazz',
  'Rock': 'Rock', 'OST': 'OST'
};

const GENRE_ORDER = ['12" (Pop)','Electronic','Funk/Soul','Indie','International','Jazz','Rock','OST'];

const GENRE_ICONS = {
  '12" (Pop)': '\uD83D\uDCBF', 'Electronic': '\uD83C\uDF9B\uFE0F',
  'Funk/Soul': '\uD83E\uDEA9', 'Indie': '\u2615\uFE0F', 'International': '\uD83C\uDF0E',
  'Jazz': '\uD83C\uDFB7', 'Rock': '\uD83C\uDFB8', 'OST': '\uD83C\uDFAE'
};

const PL_COLORS = ['#5B6B4A','#4A5E42','#6B7B5A','#3D5038','#7A8A6A','#4E6346','#5F7050','#3A4D35','#6D7E5C','#546A4C'];

function hashStr(s) { let h=0; for(let i=0;i<s.length;i++) h=((h<<5)-h+s.charCodeAt(i))|0; return Math.abs(h); }

// ======================================================
//  CSV → RECORDS
// ======================================================
let RECORDS = [];

function parseTracks(str) {
  if (!str || !str.trim()) return null;
  const sides = {};
  str.split(' | ').forEach(part => {
    const m = part.trim().match(/^([A-Z](?:-Side)?)\s*:\s*(.*)/);
    if (!m) return;
    let label = m[1];
    if (label.length === 1) label += '-Side';
    const tracks = m[2].split(',').map(t => t.trim()).filter(Boolean).map(t => {
      const fav = t.endsWith('*');
      const name = fav ? t.slice(0, -1).trim() : t;
      const obj = { name };
      if (fav) obj.fav = true;
      return obj;
    });
    sides[label] = tracks;
  });
  return Object.keys(sides).length ? sides : null;
}

function csvToRecords(rows) {
  return rows
    .filter(r => r['Album'] && r['Album'].trim())
    .map(r => {
      const rec = {
        title: r['Album'].trim(),
        artist: (r['Artist'] || '').trim(),
        genre: SECTION_MAP[(r['Genre Section'] || '').trim()] || (r['Genre Section'] || '').trim(),
        art: (r['Art'] || '').trim(),
        vibe: (r['Great if you like: '] || r['Great if you like:'] || '').trim()
      };

      const released = (r['Released'] || '').trim();
      const acquired = (r['Acquired'] || '').trim();
      const genres = (r['Genres'] || '').trim();
      const tracks = (r['Tracks'] || '').trim();

      if (released || acquired || genres || tracks) {
        const detail = {};
        if (released) detail.released = released;
        if (acquired) detail.acquired = acquired;
        if (genres) detail.genres = genres.split(',').map(g => g.trim());
        const parsed = parseTracks(tracks);
        if (parsed) detail.tracks = parsed;
        rec.detail = detail;
      }

      return rec;
    });
}

async function loadRecords() {
  try {
    const resp = await fetch('records.csv');
    const text = await resp.text();
    const result = Papa.parse(text, { header: true, skipEmptyLines: true });
    RECORDS = csvToRecords(result.data);
    renderChips();
    applyFilters();
  } catch (e) {
    document.getElementById('recordList').innerHTML =
      '<div class="empty-state"><span>⚠️</span>Could not load records.csv</div>';
    console.error('CSV load error:', e);
  }
}

// ======================================================
//  NOTIFICATIONS
// ======================================================
async function sendRequest(title, artist) {
  const btn = document.getElementById('modalRequest');
  btn.textContent = '\uD83D\uDCE9 Sending...';
  try {
    await fetch('https://ntfy.sh/' + NTFY_TOPIC, {
      method: 'POST',
      headers: { 'Title': 'Record Request' },
      body: 'A guest requested ' + title + ' by ' + artist
    });
    btn.textContent = '\u2713 Requested!';
    btn.classList.add('sent');
  } catch (e) {
    btn.textContent = '\uD83D\uDCE9 Request';
    console.error('ntfy error:', e);
  }
}

// ======================================================
//  State + Rendering
// ======================================================
let activeGenre = null;
let searchQuery = '';

function renderChips() {
  const c = document.getElementById('genreChips');
  const present = GENRE_ORDER.filter(g => RECORDS.some(r => r.genre === g));
  c.innerHTML = present.map((g, idx) => {
    const a = activeGenre === g;
    const icon = GENRE_ICONS[g] || '';
    return '<button class="genre-chip'+(a?' active':'')+'" data-idx="'+idx+'">'
      + '<span class="chip-icon">'+icon+'</span>' + g + '</button>';
  }).join('');
}

document.getElementById('genreChips').addEventListener('click', (e) => {
  const btn = e.target.closest('.genre-chip');
  if (!btn) return;
  const idx = parseInt(btn.dataset.idx);
  const present = GENRE_ORDER.filter(g => RECORDS.some(r => r.genre === g));
  toggleGenre(present[idx]);
});

function renderRecords(records) {
  const list = document.getElementById('recordList');
  const countEl = document.getElementById('recordCount');
  const total = RECORDS.length, shown = records.length;

  countEl.textContent = (activeGenre || searchQuery)
    ? 'Showing '+shown+' of '+total+' records'
    : total+' records';

  if (!records.length) {
    list.innerHTML = '<div class="empty-state"><span>\uD83C\uDFB5</span>No records found \u2014 try another search?</div>';
    return;
  }

  list.innerHTML = records.map((r,i) => {
    const globalIdx = RECORDS.indexOf(r);
    const initial = r.title.replace(/^(The |A )/i,'').charAt(0).toUpperCase();
    const bg = PL_COLORS[hashStr(r.title) % PL_COLORS.length];
    const artHTML = r.art
      ? '<img src="'+r.art+'" alt="'+r.title+'" loading="lazy">'
      : '<div class="art-placeholder" style="background:'+bg+'">'+initial+'</div>';
    const icon = GENRE_ICONS[r.genre] || '';
    const vibeHTML = r.vibe
      ? '<div class="record-vibe"><strong>If you like:</strong> '+r.vibe+'</div>' : '';
    return '<div class="record-card" data-idx="'+globalIdx+'" style="animation-delay:'+i*0.03+'s">'
      + '<div class="card-row"><div class="art-wrap">'+artHTML+'</div>'
      + '<div class="record-info">'
      + '<span class="record-title">'+r.title+'</span>'
      + '<span class="record-artist">'+r.artist+'</span>'
      + '<span class="record-genre-tag"><span class="chip-icon">'+icon+'</span>'+r.genre+'</span>'
      + '</div></div>' + vibeHTML + '</div>';
  }).join('');
}

// ======================================================
//  Modal
// ======================================================
document.getElementById('recordList').addEventListener('click', (e) => {
  const card = e.target.closest('.record-card');
  if (!card) return;
  openModal(RECORDS[parseInt(card.dataset.idx)]);
});

function openModal(r) {
  const sheet = document.getElementById('modalSheet');
  const d = r.detail || {};
  const icon = GENRE_ICONS[r.genre] || '';
  const initial = r.title.replace(/^(The |A )/i,'').charAt(0).toUpperCase();
  const bg = PL_COLORS[hashStr(r.title) % PL_COLORS.length];

  const artHTML = r.art
    ? '<img class="modal-art" src="'+r.art+'" alt="'+r.title+'">'
    : '<div class="modal-art-placeholder" style="background:'+bg+'">'+initial+'</div>';

  let metaHTML = '';
  if (d.released || d.acquired) {
    metaHTML = '<div class="modal-meta">';
    if (d.released) metaHTML += '<div class="modal-meta-item"><span class="modal-meta-label">Original Release:</span><span class="modal-meta-value">'+d.released+'</span></div>';
    if (d.acquired) metaHTML += '<div class="modal-meta-item"><span class="modal-meta-label">Acquired:</span><span class="modal-meta-value">'+d.acquired+'</span></div>';
    metaHTML += '</div>';
  }

  const sectionHTML = '<div class="modal-section-row">'
    + '<span class="modal-section-label">Section</span>'
    + '<span class="record-genre-tag"><span class="chip-icon">'+icon+'</span>'+r.genre+'</span></div>';

  let genresHTML = '';
  if (d.genres && d.genres.length) {
    genresHTML = '<div class="modal-section-label">Genre(s)</div><div class="modal-genre-tags">'
      + d.genres.map(g => '<span class="modal-genre-tag">'+g+'</span>').join('') + '</div>';
  }

  let tracksHTML = '';
  if (d.tracks) {
    tracksHTML = '<div class="modal-section-label">Track Listing</div><div class="modal-tracklist">';
    for (const [side, tracks] of Object.entries(d.tracks)) {
      tracksHTML += '<div class="modal-side-label">'+side+'</div>';
      tracks.forEach((t, i) => {
        tracksHTML += '<div class="modal-track"><span class="modal-track-num">'+(i+1)+'.</span>'
          + '<span class="modal-track-name">'+t.name+'</span>'
          + (t.fav ? '<span class="modal-track-fav">\u2606</span>' : '') + '</div>';
      });
    }
    tracksHTML += '</div>';
  }

  let vibeHTML = '';
  if (r.vibe) vibeHTML = '<div class="record-vibe" style="padding-top:20px"><strong>If you like:</strong> '+r.vibe+'</div>';

  const requestHTML = '<button class="modal-request-btn" id="modalRequest">\uD83D\uDCE9 Request</button>';

  sheet.innerHTML = '<div class="modal-header"><div class="modal-header-text">'
    + '<div class="modal-title">'+r.title+'</div>'
    + '<div class="modal-artist">'+r.artist+'</div></div>'
    + '<button class="modal-close" id="modalClose">&times;</button></div>'
    + artHTML + metaHTML + sectionHTML + genresHTML + tracksHTML + vibeHTML + requestHTML;

  document.getElementById('modalOverlay').classList.add('open');
  document.body.classList.add('modal-open');
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalRequest').addEventListener('click', () => sendRequest(r.title, r.artist));
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.classList.remove('modal-open');
}

document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeModal();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

// ======================================================
//  Filter + nav
// ======================================================
function applyFilters() {
  const q = searchQuery.toLowerCase();
  let f = RECORDS;
  if (activeGenre) f = f.filter(r => r.genre === activeGenre);
  if (q) f = f.filter(r => r.title.toLowerCase().includes(q) || r.artist.toLowerCase().includes(q) || (r.vibe && r.vibe.toLowerCase().includes(q)));
  renderRecords(f);
}

function toggleGenre(genre) {
  activeGenre = activeGenre === genre ? null : genre;
  renderChips();
  applyFilters();
}

const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');

searchInput.addEventListener('input', () => {
  searchQuery = searchInput.value;
  searchClear.classList.toggle('visible', searchQuery.length > 0);
  applyFilters();
});

searchClear.addEventListener('click', () => {
  searchInput.value = ''; searchQuery = '';
  searchClear.classList.remove('visible');
  searchInput.focus(); applyFilters();
});

document.getElementById('shuffleBtn').addEventListener('click', () => {
  activeGenre = null; searchInput.value = ''; searchQuery = '';
  searchClear.classList.remove('visible'); renderChips();
  const pick = RECORDS[Math.floor(Math.random() * RECORDS.length)];
  document.getElementById('recordCount').textContent = '\uD83C\uDFB2 Random pick!';
  renderRecords([pick]);
});

// ======================================================
//  Boot
// ======================================================
loadRecords();
</script>
</body>
</html>
